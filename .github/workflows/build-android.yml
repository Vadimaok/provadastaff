name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "www/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Apply Provoda staff launcher icon
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg, os, glob, shutil
          source = 'provoda-logo.svg'
          output = '/tmp/provoda-icon.png'
          cairosvg.svg2png(url=source, write_to=output, output_width=512, output_height=512)
          for path in glob.glob('android/app/src/main/res/mipmap-*/*'):
              if os.path.basename(path) in ('ic_launcher.png', 'ic_launcher_round.png'):
                  shutil.copyfile(output, path)
          for path in glob.glob('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml'):
              xml = '''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/black"/><foreground android:drawable="@mipmap/ic_launcher"/></adaptive-icon>\n'''
              open(path, 'w', encoding='utf-8').write(xml)
          PY

      - name: Set app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          nums = (version.split('.') + ['0', '0'])[:3]
          code = int(nums[0]) * 10000 + int(nums[1]) * 100 + int(nums[2])
          path = pathlib.Path('android/app/build.gradle')
          content = path.read_text()
          content = re.sub(r'versionCode\s+\d+', f'versionCode {code}', content, count=1)
          content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', content, count=1)
          path.write_text(content)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Provoda Staff $VERSION" --notes "Provoda Staff installers for version $VERSION."
          cp android/app/build/outputs/apk/debug/app-debug.apk Provoda-Staff-Android.apk
          gh release upload "$TAG" Provoda-Staff-Android.apk --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Provoda-Staff-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
