name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "www/**"
      - "index.html"
      - "daily-reports.js"
      - "monthly-stories.js"
      - "provoda-messenger.js"
      - "supabase/**"
      - "app-version.json"
      - "package.json"
      - "android-updater/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: provoda-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bundle the current Provoda Staff web app for Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp supabase-config.js daily-reports.js monthly-stories.js provoda-messenger.js provoda-logo.svg manifest.webmanifest app-version.json www/
          echo "Bundled web assets:"
          ls -lh www

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Install native in-app APK updater
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)
          if [ -z "$MAIN_ACTIVITY" ]; then echo "MainActivity.java was not generated"; exit 1; fi
          PACKAGE_DIR=$(dirname "$MAIN_ACTIVITY")
          cp android-updater/AppUpdaterPlugin.java "$PACKAGE_DIR/AppUpdaterPlugin.java"
          python - "$MAIN_ACTIVITY" android/app/src/main/AndroidManifest.xml <<'PY'
          from pathlib import Path
          import re, sys
          main_path, manifest_path = map(Path, sys.argv[1:])
          main = main_path.read_text()
          if 'registerPlugin(AppUpdaterPlugin.class)' not in main:
              main = main.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;')
              pattern = r'public class MainActivity extends BridgeActivity\s*\{'
              replacement = '''public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          '''
              main, count = re.subn(pattern, replacement, main, count=1)
              if count != 1:
                  raise SystemExit('Could not register AppUpdaterPlugin in MainActivity.java')
              main_path.write_text(main)
          manifest = manifest_path.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in manifest:
              manifest = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + permission, manifest, count=1)
              manifest_path.write_text(manifest)
          print('Native APK updater registered.')
          PY

      - name: Configure Firebase Cloud Messaging
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured; Android APK will build, but background push notifications will not work until Firebase is configured."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          if 'com.google.gms:google-services' not in text:
              if 'dependencies {' not in text:
                  raise SystemExit('Could not locate dependencies block in android/build.gradle')
              text = text.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'", 1)
              root.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "com.google.firebase.crashlytics" not in text:
              text += "\napply plugin: 'com.google.firebase.crashlytics'\n"
          if "firebase-crashlytics" not in text:
              text += "\ndependencies {\n    implementation platform('com.google.firebase:firebase-bom:34.4.0')\n    implementation 'com.google.firebase:firebase-crashlytics'\n}\n"
          app.write_text(text)
          PY


      - name: Configure stable Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add all four Android signing secrets before building a distributable APK."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/provoda-release.jks
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text()

          # Ensure the release signing config exists even when Capacitor has
          # already generated a signingConfigs block for the debug build.
          if 'signingConfigs {' not in text:
              android_match = re.search(r'android\\s*\\{', text)
              if not android_match:
                  raise SystemExit('Could not locate android block in app/build.gradle')
              text = text[:android_match.end()] + '\\n    signingConfigs {\\n    }\\n' + text[android_match.end():]

          if 'storeFile file("provoda-release.jks")' not in text:
              signing_match = re.search(r'signingConfigs\\s*\\{', text)
              if not signing_match:
                  raise SystemExit('Could not create release signing config')
              release_config = '''
                  release {
                      storeFile file("provoda-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              '''
              text = text[:signing_match.end()] + release_config + text[signing_match.end():]

          match = re.search(r'buildTypes\\s*\\{\\s*release\\s*\\{', text)
          if not match:
              raise SystemExit('Could not locate release build type in app/build.gradle')
          insert_at = match.end()
          if 'signingConfig signingConfigs.release' not in text[insert_at:insert_at+300]:
              text = text[:insert_at] + '\\n            signingConfig signingConfigs.release' + text[insert_at:]
          path.write_text(text)
          print('Release signing config and release build type linked.')
          PY
          echo "Stable release signing configured."

      - name: Apply Provoda Staff launcher icon
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg, pathlib, re
          from PIL import Image
          svg = pathlib.Path('provoda-logo.svg').read_text(encoding='utf-8')
          transparent_svg = re.sub(r'<rect[^>]*/>', '', svg, count=1)
          pathlib.Path('/tmp/provoda-foreground.svg').write_text(transparent_svg, encoding='utf-8')
          full_png = '/tmp/provoda-full.png'
          fg_png = '/tmp/provoda-fg-large.png'
          cairosvg.svg2png(url='provoda-logo.svg', write_to=full_png, output_width=512, output_height=512)
          cairosvg.svg2png(url='/tmp/provoda-foreground.svg', write_to=fg_png, output_width=432, output_height=432)
          density = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for name,size in density.items():
              folder=pathlib.Path('android/app/src/main/res')/('mipmap-'+name)
              folder.mkdir(parents=True,exist_ok=True)
              with Image.open(full_png).convert('RGBA') as im:
                  im.resize((size,size),Image.Resampling.LANCZOS).save(folder/'ic_launcher.png')
                  im.resize((size,size),Image.Resampling.LANCZOS).save(folder/'ic_launcher_round.png')
              fg_size=round(size*2.25)
              with Image.open(fg_png).convert('RGBA') as im:
                  im.resize((fg_size,fg_size),Image.Resampling.LANCZOS).save(folder/'ic_launcher_foreground.png')
          xml='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          folder=pathlib.Path('android/app/src/main/res/mipmap-anydpi-v26')
          folder.mkdir(parents=True,exist_ok=True)
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              (folder/name).write_text(xml,encoding='utf-8')
          colors=pathlib.Path('android/app/src/main/res/values')
          colors.mkdir(parents=True,exist_ok=True)
          (colors/'ic_launcher_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#1d202b</color></resources>
          ''',encoding='utf-8')

      - name: Set app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          nums = (version.split('.') + ['0', '0'])[:3]
          code = int(nums[0]) * 10000 + int(nums[1]) * 100 + int(nums[2])
          path = pathlib.Path('android/app/build.gradle')
          content = path.read_text()
          content = re.sub(r'versionCode\s+\d+', f'versionCode {code}', content, count=1)
          content = re.sub(r"versionName\s+['\"][^'\"]+['\"]", f"versionName '{version}'", content, count=1)
          path.write_text(content)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Provoda Staff $VERSION" --notes "Provoda Staff installers for version $VERSION." || gh release view "$TAG" >/dev/null
          cp android/app/build/outputs/apk/release/app-release.apk Provoda-Staff-Android.apk
          gh release upload "$TAG" Provoda-Staff-Android.apk --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Provoda-Staff-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
