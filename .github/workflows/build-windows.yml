name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Render high-resolution Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          cairosvg.svg2png(url='provoda-logo.svg', write_to='provoda-icon-temp.png', output_width=512, output_height=512)
          image = Image.open('provoda-icon-temp.png').convert('RGBA')
          image.save('desktop/provoda-icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          import pathlib
          pathlib.Path('provoda-icon-temp.png').unlink(missing_ok=True)
          PY

      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist

      - name: Publish EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Provoda Staff $version" --notes "Provoda Staff installers for version $version."; if ($LASTEXITCODE -ne 0) { gh release view $tag; if ($LASTEXITCODE -ne 0) { throw "Could not create or find GitHub release $tag" } } }
          gh release upload $tag "desktop/dist/Provoda-Staff-$version.exe" --clobber

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Provoda-Staff-Windows
          path: desktop/dist/Provoda-Staff-*.exe
          if-no-files-found: error
          retention-days: 30
