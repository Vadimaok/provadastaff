name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Prepare Provoda Staff icon
        shell: pwsh
        working-directory: desktop
        run: |
          $iconBytes = [Convert]::FromBase64String((Get-Content -Raw provoda-icon.ico.base64).Trim())
          [IO.File]::WriteAllBytes('provoda-icon.ico', $iconBytes)
      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist

      - name: Publish EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Provoda Staff $version" --notes "Provoda Staff installers for version $version." }
          gh release upload $tag "desktop/dist/Provoda-Staff-$version.exe" --clobber

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Provoda-Staff-Windows
          path: desktop/dist/Provoda-Staff-*.exe
          if-no-files-found: error
          retention-days: 30
